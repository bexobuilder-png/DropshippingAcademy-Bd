<div style="background:#fbf9ef;padding:24px;font-family:Arial,sans-serif;color:#171412">
  <div style="max-width:480px;margin:0 auto;background:#f2f0e7;border:2px solid #171412;border-radius:12px;padding:28px 24px">
    <p style="margin:0 0 8px;font-size:12px;font-weight:700;color:#813502">DROPSHIPPING ACADEMY</p>
    <h2 style="margin:0 0 12px;font-size:26px;font-weight:800;color:#171412">Verify your email</h2>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.4;color:#171412">Enter this 6-digit code on the waitlist page to confirm your spot:</p>
    <div style="background:#ffffff;border:2px solid #171412;border-radius:10px;padding:16px;text-align:center;margin-bottom:20px">
      <span style="font-size:32px;font-weight:800;letter-spacing:8px;color:#171412">{{ .Token }}</span>
    </div>
    <p style="margin:0;font-size:13px;color:#813502;font-weight:700">This code expires shortly. Do not share it with anyone.</p>
  </div>
</div>
