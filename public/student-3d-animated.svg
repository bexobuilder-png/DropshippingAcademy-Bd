<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 733" width="720" height="733" role="img" aria-label="Animated 3D stage with glowing sun and stars">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#FFB74D" />
      <stop offset="75%" stop-color="#FFA726" />
      <stop offset="92%" stop-color="#FF9800" />
      <stop offset="98%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </radialGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B280F" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#803314" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#993D18" stop-opacity="0.8" />
      <stop offset="88%" stop-color="#B2471C" stop-opacity="0.55" />
      <stop offset="96%" stop-color="#CC5220" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#CC5220" stop-opacity="0" />
    </radialGradient>

    <filter id="glowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes sunPulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 16px rgba(255, 183, 77, 0.45));
        }
        50% {
          transform: scale(1.032);
          filter: drop-shadow(0 0 32px rgba(255, 204, 128, 0.75));
        }
      }

      @keyframes ringShimmer {
        0%, 100% { opacity: 0.88; transform: rotate(0deg); }
        50% { opacity: 1; transform: rotate(180deg); }
      }

      @keyframes shadowBreathe {
        0%, 100% { transform: scale(1, 1); opacity: 0.92; }
        50% { transform: scale(1.035, 1.08); opacity: 1; }
      }

      @keyframes starTwinkle1 {
        0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.22) rotate(45deg); opacity: 1; }
      }

      @keyframes starTwinkle2 {
        0%, 100% { transform: scale(0.65) rotate(0deg); opacity: 0.4; }
        50% { transform: scale(1.28) rotate(-40deg); opacity: 1; }
      }

      @keyframes starTwinkle3 {
        0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.2) rotate(35deg); opacity: 1; }
      }

      .anim-sun-group {
        transform-origin: 360px 365px;
        animation: sunPulse 4.2s ease-in-out infinite;
      }

      .anim-ring {
        transform-origin: 360px 365px;
        animation: ringShimmer 12s linear infinite;
      }

      .anim-shadow {
        transform-origin: 360px 675px;
        animation: shadowBreathe 4.2s ease-in-out infinite;
      }

      .anim-star-1 {
        transform-origin: 268px 54px;
        animation: starTwinkle1 2.4s ease-in-out infinite;
      }

      .anim-star-2 {
        transform-origin: 148px 202px;
        animation: starTwinkle2 3.1s ease-in-out infinite 0.9s;
      }

      .anim-star-3 {
        transform-origin: 654px 338px;
        animation: starTwinkle3 2.7s ease-in-out infinite 1.6s;
      }
    </style>
  </defs>

  <!-- Ground Stage Shadow Oval -->
  <g class="anim-shadow">
    <ellipse cx="360" cy="675" rx="265" ry="24" fill="url(#shadowGrad)" />
    <!-- Fine concentric rings on the ground shadow for texture -->
    <ellipse cx="360" cy="675" rx="245" ry="21" fill="none" stroke="#60220A" stroke-opacity="0.3" stroke-width="1.2" />
    <ellipse cx="360" cy="675" rx="215" ry="17" fill="none" stroke="#501C08" stroke-opacity="0.35" stroke-width="1.2" />
    <ellipse cx="360" cy="675" rx="175" ry="13" fill="none" stroke="#451806" stroke-opacity="0.4" stroke-width="1.5" />
    <ellipse cx="360" cy="675" rx="125" ry="9" fill="none" stroke="#3D1404" stroke-opacity="0.45" stroke-width="1.5" />
    <ellipse cx="360" cy="675" rx="70" ry="5" fill="none" stroke="#331003" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <!-- Glowing Sun Orb with concentric rings -->
  <g class="anim-sun-group">
    <!-- Outer ambient aura -->
    <circle cx="360" cy="365" r="202" fill="#FFE082" opacity="0.3" filter="url(#glowGlow)" />
    
    <!-- Base filled orb -->
    <circle cx="360" cy="365" r="198" fill="url(#sunGrad)" />

    <!-- Concentric fine aesthetic rings -->
    <g class="anim-ring">
      <circle cx="360" cy="365" r="197" fill="none" stroke="#FFF9C4" stroke-width="2.5" opacity="0.95" />
      <circle cx="360" cy="365" r="193" fill="none" stroke="#FFF176" stroke-width="1.2" opacity="0.75" />
      <circle cx="360" cy="365" r="187" fill="none" stroke="#FFEE58" stroke-width="1.1" opacity="0.7" />
      <circle cx="360" cy="365" r="180" fill="none" stroke="#FFD54F" stroke-width="1.1" opacity="0.65" />
      <circle cx="360" cy="365" r="172" fill="none" stroke="#FFCA28" stroke-width="1.1" opacity="0.6" />
      <circle cx="360" cy="365" r="163" fill="none" stroke="#FFC107" stroke-width="1.1" opacity="0.55" />
      <circle cx="360" cy="365" r="153" fill="none" stroke="#FFB300" stroke-width="1.1" opacity="0.5" />
      <circle cx="360" cy="365" r="142" fill="none" stroke="#FFA000" stroke-width="1.1" opacity="0.48" />
      <circle cx="360" cy="365" r="130" fill="none" stroke="#FF8F00" stroke-width="1.1" opacity="0.45" />
      <circle cx="360" cy="365" r="117" fill="none" stroke="#FFB74D" stroke-width="1.1" opacity="0.42" />
      <circle cx="360" cy="365" r="103" fill="none" stroke="#FFA726" stroke-width="1.1" opacity="0.4" />
      <circle cx="360" cy="365" r="88" fill="none" stroke="#FF9800" stroke-width="1.1" opacity="0.38" />
      <circle cx="360" cy="365" r="72" fill="none" stroke="#FB8C00" stroke-width="1.1" opacity="0.35" />
      <circle cx="360" cy="365" r="55" fill="none" stroke="#F57C00" stroke-width="1.1" opacity="0.32" />
      <circle cx="360" cy="365" r="37" fill="none" stroke="#FFE082" stroke-width="1.1" opacity="0.3" />
      <circle cx="360" cy="365" r="18" fill="none" stroke="#FFF9C4" stroke-width="1.1" opacity="0.35" />
    </g>
  </g>

  <!-- Twinkling Star 1 (Top Left) -->
  <g class="anim-star-1" filter="url(#starGlow)">
    <path d="M 268 40 Q 268 54 282 54 Q 268 54 268 68 Q 268 54 254 54 Q 268 54 268 40 Z" fill="#FFF9C4" />
    <circle cx="268" cy="54" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Twinkling Star 2 (Far Left) -->
  <g class="anim-star-2" filter="url(#starGlow)">
    <path d="M 148 186 Q 148 202 164 202 Q 148 202 148 218 Q 148 202 132 202 Q 148 202 148 186 Z" fill="#FFF9C4" />
    <circle cx="148" cy="202" r="2.6" fill="#FFFFFF" />
  </g>

  <!-- Twinkling Star 3 (Right) -->
  <g class="anim-star-3" filter="url(#starGlow)">
    <path d="M 654 324 Q 654 338 668 338 Q 654 338 654 352 Q 654 338 640 338 Q 654 338 654 324 Z" fill="#FFF9C4" />
    <circle cx="654" cy="338" r="2.2" fill="#FFFFFF" />
  </g>
</svg>
